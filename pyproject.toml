[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytello-core"
version = "0.1.0"
description = "A reliable, clean-room Python interface library for the DJI/Ryze Tello drone"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pytello contributors" }]
keywords = ["tello", "drone", "dji", "ryze", "robotics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Hardware",
    "Intended Audience :: Developers",
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
]
dependencies = [
    "av>=11.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
examples = ["opencv-python>=4.8.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/clams2121/pytello"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pytello = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pytello"]
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples", "hardware_tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pytello"]
